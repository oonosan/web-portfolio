<section id="what-i-do" class="border-t border-line">
  <div class="mx-auto max-w-6xl px-6 py-20 md:py-28">
    <div class="mb-14 grid gap-6 md:grid-cols-12">
      <p class="eyebrow md:col-span-3">01 — What I do</p>
      <h2 class="section-title md:col-span-9">
        From open-ended brief to a concept people can click, test and defend.
      </h2>
    </div>

    <ol class="grid gap-x-12 md:grid-cols-2">
      @for (item of items; track item.title; let i = $index) {
        <li class="border-t border-line py-8">
          <div class="flex gap-5">
            <span class="font-mono text-xs text-accent pt-1.5">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <div>
              <h3 class="font-serif text-2xl leading-tight tracking-tight">{{ item.title }}</h3>
              <p class="mt-3 leading-relaxed text-ink-soft">{{ item.body }}</p>
            </div>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
