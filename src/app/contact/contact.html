<footer id="contact" class="bg-ink text-paper">
  <div class="mx-auto max-w-6xl px-6 py-20 md:py-28">
    <p class="eyebrow mb-6 !text-paper/60">06 — Contact</p>
    <h2
      class="max-w-3xl font-serif text-[clamp(2.25rem,6vw,4.5rem)] font-medium leading-[1] tracking-[-0.03em]"
    >
      Have a fuzzy idea that needs to become something testable?
    </h2>

    <ul class="mt-12 flex flex-wrap gap-x-10 gap-y-4">
      @for (link of links; track link.label) {
        <li>
          <a
            [href]="link.href"
            class="group inline-flex items-center gap-2 border-b border-paper/30 pb-1 text-lg transition-colors hover:border-[#ff8a64] hover:text-[#ff8a64]"
          >
            {{ link.label }}
            <span aria-hidden="true" class="transition-transform group-hover:translate-x-1">→</span>
          </a>
        </li>
      }
    </ul>

    <div
      class="mt-20 flex flex-col gap-3 border-t border-paper/15 pt-6 text-paper/50 sm:flex-row sm:justify-between"
    >
      <span class="eyebrow !text-paper/50">© 2026 Karen Ono</span>
      <a href="#top" class="eyebrow !text-paper/50 hover:!text-paper">Back to top ↑</a>
    </div>
  </div>
</footer>
