<section id="domains" class="border-t border-line bg-paper-deep/50">
  <div class="mx-auto max-w-6xl px-6 py-20 md:py-24">
    <div class="grid gap-10 md:grid-cols-12">
      <p class="eyebrow md:col-span-3">02 — Domains</p>
      <ul class="md:col-span-9">
        @for (d of domains; track d.name) {
          <li
            class="flex flex-col gap-1 border-b border-line py-5 first:pt-0 sm:flex-row sm:items-baseline sm:justify-between"
          >
            <span class="font-serif text-2xl tracking-tight md:text-3xl">{{ d.name }}</span>
            @if (d.detail) {
              <span class="eyebrow">{{ d.detail }}</span>
            }
          </li>
        }
      </ul>
    </div>
  </div>
</section>
