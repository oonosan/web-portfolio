<section id="toolkit" class="border-t border-line">
  <div class="mx-auto max-w-6xl px-6 py-20 md:py-24">
    <div class="grid gap-10 md:grid-cols-12">
      <p class="eyebrow md:col-span-3">04 — Tools &amp; methods</p>
      <ul class="flex flex-wrap gap-3 md:col-span-9">
        @for (tool of tools; track tool) {
          <li class="tag text-base">{{ tool }}</li>
        }
      </ul>
    </div>
  </div>
</section>
